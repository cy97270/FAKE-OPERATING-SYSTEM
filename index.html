<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HALO OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="bootScreen">
    <h1>HALO OS</h1>
    <p class="subtitle">(Hazard Assessment and Logistics Organization Operating System)</p>
    <p id="status">Booting system...</p>
</div>

<div id="desktop">
    <div id="taskbar">
        <div></div>
        <div id="clock"></div>
        <div id="runtimeclock"></div>
    </div>
</div>

<div id="loginScreen">
  <h1>HALO OS</h1>

  <input id="username" placeholder="Username">
  <input id="password" placeholder="Password">

  <button onclick="login()">LOGIN</button>

  <p id="error"></p>
</div>
<script src="script.js"></script>
</body>
</html>
